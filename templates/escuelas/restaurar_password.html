{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurar contraseña — GESAC Campus</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23146C43'/><g fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' transform='translate(12 12) scale(1.67)'><path d='M22 10 12 5 2 10l10 5 10-5Z'/><path d='M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5'/></g></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Rubik', sans-serif; }
        body {
            min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0F5132 0%, #146C43 45%, #D9812C 100%);
            padding: 20px;
        }
        .registro-wrap { width: 100%; max-width: 440px; }
        .registro-logo { text-align: center; margin-bottom: 22px; color: white; }
        .registro-logo .icono {
            width: 62px; height: 62px; border-radius: 18px; background: rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 1.8rem;
        }
        .registro-logo .marca { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.02em; }
        .registro-logo .subtitulo { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }
        .registro-card { background: white; border-radius: 18px; padding: 32px 30px; box-shadow: 0 12px 40px rgba(0,0,0,0.22); }
        .registro-card h5 { font-weight: 700; color: #0F5132; margin-bottom: 6px; text-align: center; }
        .registro-card .registro-hint { text-align: center; font-size: 0.82rem; color: #6b7280; margin-bottom: 22px; }
        .registro-form label {
            font-weight: 600; font-size: 0.78rem; color: #146C43; text-transform: uppercase;
            letter-spacing: 0.02em; margin-bottom: 5px; display: block;
        }
        .registro-form .field-wrap { margin-bottom: 16px; }
        .registro-form input {
            width: 100%; border: 1px solid #dde3ec; border-radius: 10px; padding: 10px 13px; font-size: 0.92rem;
        }
        .registro-form input:focus { outline: none; border-color: #146C43; box-shadow: 0 0 0 3px rgba(20,108,67,0.15); }
        .registro-alert { background: #FDECEC; color: #B91C1C; border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; margin-bottom: 18px; }
        .btn-crear-cuenta {
            width: 100%; background: linear-gradient(135deg, #146C43, #0F5132); color: white; border: none;
            border-radius: 10px; padding: 12px; font-weight: 700; font-size: 0.94rem; margin-top: 6px;
        }
        .btn-crear-cuenta:hover { opacity: 0.92; color: white; }
        .registro-footer { text-align: center; margin-top: 18px; }
        .registro-footer a { color: rgba(255,255,255,0.9); font-size: 0.85rem; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="registro-wrap">
        <div class="registro-logo">
            <div class="icono"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg></div>
            <div class="marca">GESAC <span style="color:#F6B26B">Campus</span></div>
            <div class="subtitulo">Restaurar contraseña</div>
        </div>

        <div class="registro-card">
            <h5>¿Olvidaste tu contraseña?</h5>
            <div class="registro-hint">Captura tu correo y te enviamos un link para crear una nueva.</div>

            {% if form.errors %}
                <div class="registro-alert">Captura un correo válido.</div>
            {% endif %}

            <form method="post" class="registro-form">
                {% csrf_token %}
                <div class="field-wrap">
                    <label for="id_email">Correo electrónico</label>
                    <input type="email" id="id_email" name="email" required>
                </div>
                <button type="submit" class="btn-crear-cuenta">
                    <i class="bi bi-send-fill me-1"></i>Enviar link de restauración
                </button>
            </form>
        </div>

        <div class="registro-footer">
            <a href="{% url 'login_escuela' %}">Volver a iniciar sesión</a>
        </div>
    </div>
</body>
</html>
