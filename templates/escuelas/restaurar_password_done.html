{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisa tu correo — ERP Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Rubik', sans-serif; }
        body {
            min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0F5132 0%, #146C43 45%, #D9812C 100%);
            padding: 20px;
        }
        .registro-wrap { width: 100%; max-width: 440px; }
        .registro-logo { text-align: center; margin-bottom: 22px; color: white; }
        .registro-logo .icono {
            width: 62px; height: 62px; border-radius: 18px; background: rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 1.8rem;
        }
        .registro-logo .marca { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.02em; }
        .registro-card { background: white; border-radius: 18px; padding: 36px 30px; box-shadow: 0 12px 40px rgba(0,0,0,0.22); text-align: center; }
        .registro-card .icono-ok { font-size: 2.6rem; color: #146C43; margin-bottom: 14px; }
        .registro-card h5 { font-weight: 700; color: #0F5132; margin-bottom: 10px; }
        .registro-card p { font-size: 0.9rem; color: #6b7280; margin-bottom: 0; }
        .registro-footer { text-align: center; margin-top: 18px; }
        .registro-footer a { color: rgba(255,255,255,0.9); font-size: 0.85rem; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="registro-wrap">
        <div class="registro-logo">
            <div class="icono"><i class="bi bi-mortarboard-fill"></i></div>
            <div class="marca">ERP Escolar</div>
        </div>

        <div class="registro-card">
            <div class="icono-ok"><i class="bi bi-envelope-check-fill"></i></div>
            <h5>Revisa tu correo</h5>
            <p>Si el correo que capturaste está registrado, te acabamos de enviar un link para crear una nueva contraseña. Puede tardar unos minutos en llegar -- revisa también spam.</p>
        </div>

        <div class="registro-footer">
            <a href="{% url 'login_escuela' %}">Volver a iniciar sesión</a>
        </div>
    </div>
</body>
</html>
