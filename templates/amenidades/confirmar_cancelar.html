{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cancelar Reservación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); font-family: 'Rubik', sans-serif; }
        .glass-card { background: rgba(255,255,255,0.9); border-radius: 18px; box-shadow: 0 8px 32px 0 rgba(31,38,135,0.15); }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 500px;">
        <div class="glass-card p-4 text-center">
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 2.5rem;"></i>
            <h4 class="mt-3">¿Cancelar esta reservación?</h4>
            <p class="text-muted">
                {{ reservacion.amenidad.nombre }} — {{ reservacion.fecha|date:"d/m/Y" }}
                de {{ reservacion.hora_inicio|time:"H:i" }} a {{ reservacion.hora_fin|time:"H:i" }}
            </p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">
                    <i class="bi bi-x-circle"></i> Sí, cancelar
                </button>
                <a href="{% url 'mis_reservaciones' %}" class="btn btn-outline-secondary px-4">
                    No, volver
                </a>
            </form>
        </div>
    </div>
</body>
</html>
