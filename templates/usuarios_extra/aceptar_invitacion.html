{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aceptar Invitación — GESAC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif; background: linear-gradient(135deg, #0f2d52 0%, #1a5276 60%, #2471a3 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .invitacion-card { background: white; border-radius: 20px; padding: 36px 34px; max-width: 460px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
        .invitacion-icono { font-size: 2.4rem; color: #2471a3; text-align: center; margin-bottom: 8px; }
        .invitacion-titulo { font-size: 1.25rem; font-weight: 700; text-align: center; color: #1a1a1a; margin-bottom: 4px; }
        .invitacion-sub { text-align: center; color: #6b7280; font-size: 0.88rem; margin-bottom: 24px; }
        .form-label { font-weight: 600; font-size: 0.8rem; color: #1a5276; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 5px; }
        .form-control { border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.9rem; padding: 9px 12px; }
        .btn-crear { background: linear-gradient(135deg, #1a5276, #2471a3); color: white; border: none; border-radius: 10px; padding: 11px; font-weight: 700; font-size: 0.92rem; width: 100%; }
        .btn-crear:hover { color: white; }
    </style>
</head>
<body>
    <div class="invitacion-card">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <div class="invitacion-icono"><i class="bi bi-person-plus-fill"></i></div>
        <div class="invitacion-titulo">Te invitaron a GESAC</div>
        <div class="invitacion-sub">Crea tu cuenta para colaborar en <strong>{{ invitacion.empresa.nombre }}</strong></div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Tu nombre</label>
                <input type="text" name="nombre" class="form-control" placeholder="Nombre completo" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre de usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Para iniciar sesión" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" value="{{ invitacion.email }}" disabled>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>
            <button type="submit" class="btn-crear">
                <i class="bi bi-check-circle-fill me-1"></i> Crear mi cuenta
            </button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
